<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CyberPi: Inputs &amp; Outputs – Lesson 5: Microcontrollers</title>
  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME SYSTEM (Strict Color Coding: Input, Process, Output)
       ========================================================================== */
    :root {
      /* Core Concept Colors - FIXED ACROSS ALL PHASES */
      --color-input: #10b981;        /* Emerald Green */
      --color-input-bg: rgba(16, 185, 129, 0.11);
      --color-input-border: rgba(16, 185, 129, 0.45);
      --color-input-text: #047857;
      --color-input-glow: rgba(16, 185, 129, 0.35);

      --color-output: #3b82f6;       /* Royal Blue */
      --color-output-bg: rgba(59, 130, 246, 0.11);
      --color-output-border: rgba(59, 130, 246, 0.45);
      --color-output-text: #1d4ed8;
      --color-output-glow: rgba(59, 130, 246, 0.35);

      --color-process: #334155;      /* Neutral Slate Dark */
      --color-process-bg: rgba(51, 65, 85, 0.1);
      --color-process-border: rgba(100, 116, 139, 0.4);
      --color-process-text: #1e293b;

      /* Theme 1: Daylight Studio (Default Light) */
      --bg-app: #f1f5f9;
      --bg-gradient: radial-gradient(circle at 12% 10%, rgba(16, 185, 129, 0.08), transparent 42%),
                     radial-gradient(circle at 88% 15%, rgba(59, 130, 246, 0.09), transparent 45%),
                     linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      --bg-card: rgba(255, 255, 255, 0.88);
      --bg-card-solid: #ffffff;
      --bg-subtle: rgba(241, 245, 249, 0.9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-subtle: rgba(203, 213, 225, 0.75);
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 14px 34px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 22px 48px rgba(15, 23, 42, 0.14);
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --takeaway-bg: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
      --takeaway-border: #facc15;
      --takeaway-text: #854d0e;
      --danger: #ef4444;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    /* Theme 2: Cyber Midnight (Dark Neon) */
    [data-theme="dark"] {
      --color-input: #10b981;
      --color-input-bg: rgba(16, 185, 129, 0.16);
      --color-input-border: rgba(16, 185, 129, 0.5);
      --color-input-text: #6ee7b7;

      --color-output: #3b82f6;
      --color-output-bg: rgba(59, 130, 246, 0.18);
      --color-output-border: rgba(59, 130, 246, 0.5);
      --color-output-text: #93c5fd;

      --color-process: #475569;
      --color-process-bg: rgba(71, 85, 105, 0.3);
      --color-process-border: rgba(148, 163, 184, 0.38);
      --color-process-text: #e2e8f0;

      --bg-app: #070b14;
      --bg-gradient: radial-gradient(circle at 15% 12%, rgba(16, 185, 129, 0.14), transparent 45%),
                     radial-gradient(circle at 85% 18%, rgba(59, 130, 246, 0.16), transparent 48%),
                     linear-gradient(180deg, #070b14 0%, #0f172a 100%);
      --bg-card: rgba(19, 28, 49, 0.85);
      --bg-card-solid: #131c31;
      --bg-subtle: rgba(30, 41, 59, 0.85);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(51, 65, 85, 0.75);
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 16px 38px rgba(0, 0, 0, 0.55);
      --shadow-lg: 0 24px 52px rgba(0, 0, 0, 0.7);
      --accent-primary: #818cf8;
      --accent-primary-hover: #6366f1;
      --takeaway-bg: linear-gradient(135deg, rgba(234, 179, 8, 0.16) 0%, rgba(202, 138, 4, 0.12) 100%);
      --takeaway-border: rgba(250, 204, 21, 0.45);
      --takeaway-text: #fde047;
    }

    /* Theme 3: Robotics Lab (Warm Blueprint / High-Contrast) */
    [data-theme="blueprint"] {
      --color-input: #10b981;
      --color-input-bg: rgba(16, 185, 129, 0.18);
      --color-input-border: #10b981;
      --color-input-text: #a7f3d0;

      --color-output: #3b82f6;
      --color-output-bg: rgba(59, 130, 246, 0.2);
      --color-output-border: #60a5fa;
      --color-output-text: #bfdbfe;

      --color-process: #334155;
      --color-process-bg: rgba(30, 58, 138, 0.45);
      --color-process-border: rgba(147, 197, 253, 0.35);
      --color-process-text: #e0f2fe;

      --bg-app: #0c1e3a;
      --bg-gradient: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
                     radial-gradient(circle at 50% 0%, #173766 0%, #09172e 100%);
      --bg-card: rgba(15, 36, 70, 0.88);
      --bg-card-solid: #0f2446;
      --bg-subtle: rgba(23, 52, 99, 0.85);
      --text-main: #f0f9ff;
      --text-muted: #bae6fd;
      --border-subtle: rgba(56, 189, 248, 0.28);
      --shadow-sm: 0 4px 16px rgba(2, 12, 27, 0.45);
      --shadow-md: 0 16px 38px rgba(2, 12, 27, 0.6);
      --shadow-lg: 0 24px 52px rgba(2, 12, 27, 0.75);
      --accent-primary: #38bdf8;
      --accent-primary-hover: #0284c7;
      --takeaway-bg: rgba(250, 204, 21, 0.16);
      --takeaway-border: rgba(250, 204, 21, 0.5);
      --takeaway-text: #fef08a;
    }

    /* ==========================================================================
       RESET & BASE TYPOGRAPHY
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-app);
      background-image: var(--bg-gradient);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    /* Ambient Aurora Orbs for Ultra-Modern Depth */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    body::before {
      top: -90px;
      left: -80px;
      background: var(--color-input);
    }

    body::after {
      bottom: -100px;
      right: -80px;
      background: var(--color-output);
      animation-delay: -7s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(45px, 35px) scale(1.15); }
    }

    /* ==========================================================================
       HEADER, THEME SWITCHER & 3-STAGE PROGRESS BAR
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 860px;
      margin: 0 auto;
    }

    .lesson-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lesson-badge {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #ffffff;
      background: linear-gradient(135deg, var(--color-input), var(--color-output));
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
    }

    .theme-switcher {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 28px;
    }

    .theme-btn.active {
      background: var(--bg-card-solid);
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    .sound-btn {
      border: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .sound-btn:hover {
      border-color: var(--accent-primary);
    }

    .stage-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .stage-pill {
      text-align: center;
      font-size: 0.83rem;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--bg-subtle);
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-pill.active {
      background: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    .stage-pill.done {
      background: var(--color-input-bg);
      color: var(--color-input-text);
      border-color: var(--color-input-border);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--color-input), var(--accent-primary), var(--color-output));
      border-radius: 999px;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==========================================================================
       MAIN CONTAINER & HERO CARDS
       ========================================================================== */
    .main-container {
      max-width: 860px;
      margin: 0 auto;
      padding: 22px 16px 56px;
      position: relative;
      z-index: 1;
    }

    .card-surface {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      animation: cardEntrance 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (max-width: 520px) {
      .card-surface {
        padding: 18px 14px;
      }
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hero-banner-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(99, 102, 241, 0.12) 50%, rgba(59, 130, 246, 0.12) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      position: relative;
      overflow: hidden;
    }

    .hero-banner-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
      background-size: 14px 14px;
      opacity: 0.45;
      pointer-events: none;
    }

    .step-hero-text {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .step-hero-art {
      width: 96px;
      height: 96px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card-solid);
      border-radius: 22px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 1;
    }

    @media (max-width: 540px) {
      .hero-banner-card {
        flex-direction: column-reverse;
        text-align: center;
      }
      .step-hero-art {
        width: 84px;
        height: 84px;
      }
    }

    .step-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .step-counter {
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--accent-primary);
    }

    .explore-badge {
      font-size: 0.82rem;
      font-weight: 800;
      padding: 5px 13px;
      border-radius: 999px;
      background: var(--bg-subtle);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      transition: all 0.25s ease;
    }

    .explore-badge.complete {
      background: var(--color-input-bg);
      color: var(--color-input-text);
      border-color: var(--color-input-border);
    }

    h1 {
      font-size: 1.55rem;
      line-height: 1.25;
      margin-bottom: 6px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .step-intro {
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* ==========================================================================
       CUSTOM SVG ILLUSTRATIONS & ANIMATIONS
       ========================================================================== */
    .svg-icon {
      width: 58px;
      height: 58px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.14));
    }

    .svg-icon-lg {
      width: 84px;
      height: 84px;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(99, 102, 241, 0.25));
    }

    @keyframes pulseSignal {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes flowDash {
      to { stroke-dashoffset: -24; }
    }

    .anim-pulse {
      animation: pulseSignal 2.8s infinite ease-in-out;
      transform-origin: center;
    }

    .anim-dash {
      stroke-dasharray: 6 6;
      animation: flowDash 1s linear infinite;
    }

    /* Confetti Particle Canvas */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* ==========================================================================
       PHASE 1: INTERACTIVE EXPLORATION ELEMENTS
       ========================================================================== */
    .ipo-flow {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    @media (max-width: 620px) {
      .ipo-flow {
        grid-template-columns: 1fr;
      }
      .flow-arrow {
        transform: rotate(90deg);
        margin: 0 auto;
      }
    }

    .flow-arrow {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--text-muted);
      text-align: center;
    }

    .node-btn {
      min-height: 112px;
      padding: 16px 12px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .node-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-sm);
    }

    .node-btn.type-input {
      border-color: var(--color-input-border);
      background: var(--color-input-bg);
      color: var(--color-input-text);
    }

    .node-btn.type-process {
      border-color: var(--color-process-border);
      background: var(--color-process-bg);
      color: var(--color-process-text);
    }

    .node-btn.type-output {
      border-color: var(--color-output-border);
      background: var(--color-output-bg);
      color: var(--color-output-text);
    }

    .node-btn.selected {
      box-shadow: 0 0 0 3px var(--accent-primary), var(--shadow-md);
      transform: translateY(-3px);
    }

    .node-btn .check-dot {
      position: absolute;
      top: 9px;
      right: 10px;
      font-size: 0.9rem;
    }

    /* Tile Grid (Steps 2, 3, 4) */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .tile-btn {
      min-height: 122px;
      padding: 16px 12px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-subtle);
      background: var(--bg-subtle);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      position: relative;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tile-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-sm);
    }

    .tile-btn.type-input.visited, .tile-btn.type-input.selected {
      background: var(--color-input-bg);
      border-color: var(--color-input);
      color: var(--color-input-text);
    }

    .tile-btn.type-output.visited, .tile-btn.type-output.selected {
      background: var(--color-output-bg);
      border-color: var(--color-output);
      color: var(--color-output-text);
    }

    .tile-btn.selected {
      transform: translateY(-3px) scale(1.02);
      box-shadow: var(--shadow-md);
    }

    .tile-status {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.85rem;
    }

    /* Info Reveal Panel */
    .info-panel {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-left: 6px solid var(--accent-primary);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 20px;
      min-height: 124px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.25s ease;
    }

    @media (max-width: 520px) {
      .info-panel {
        flex-direction: column;
        text-align: center;
      }
    }

    .info-panel.type-input {
      border-left-color: var(--color-input);
      background: var(--color-input-bg);
    }

    .info-panel.type-output {
      border-left-color: var(--color-output);
      background: var(--color-output-bg);
    }

    .info-panel.type-process {
      border-left-color: var(--color-process);
      background: var(--color-process-bg);
    }

    .info-panel-visual {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: var(--bg-card-solid);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .info-panel-content {
      flex: 1;
    }

    .info-panel-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    @media (max-width: 520px) {
      .info-panel-header {
        justify-content: center;
      }
    }

    .category-chip {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .chip-input {
      background: var(--color-input);
      color: #ffffff;
    }

    .chip-output {
      background: var(--color-output);
      color: #ffffff;
    }

    .chip-process {
      background: var(--color-process);
      color: #ffffff;
    }

    .info-panel-body {
      font-size: 0.98rem;
      color: var(--text-main);
    }

    .info-panel-note {
      margin-top: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* ==========================================================================
       STEP 5: LIVE CYBERPI HARDWARE SIMULATOR
       ========================================================================== */
    .sim-wrapper {
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    @media (max-width: 700px) {
      .sim-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .cyberpi-board {
      background: linear-gradient(145deg, #1e293b 0%, #090d16 100%);
      color: #f8fafc;
      border-radius: 28px;
      padding: 20px 18px;
      border: 3px solid #334155;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.42), inset 0 2px 8px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
    }

    /* Gold Edge Connector Pins at Bottom of Virtual CyberPi */
    .cyberpi-board::after {
      content: "";
      width: 68%;
      height: 8px;
      border-radius: 4px;
      background: repeating-linear-gradient(90deg, #eab308 0px, #eab308 6px, transparent 6px, transparent 10px);
      opacity: 0.85;
      margin-top: 2px;
    }

    .board-brand-bar {
      width: 100%;
      max-width: 250px;

  <!-- ========================================================================

  <canvas id="fx-canvas"></canvas>

  <!-- ========================================================================
       DYNAMIC LESSON CONTAINER
       ======================================================================== -->

  <script>
    /* ========================================================================
       WEB AUDIO SYNTHESIZER & CONFETTI PARTICLE ENGINE (Zero External Files)
       ======================================================================== */
    const SoundFX = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      play(type) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          if (type === 'tap') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
            gain.gain.setValueAtTime(0.11, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            osc.start(now);
            osc.stop(now + 0.32);
          } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(165, now + 0.22);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            osc.start(now);
            osc.stop(now + 0.24);
          } else if (type === 'flip') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(340, now);
            osc.frequency.exponentialRampToValueAtTime(490, now + 0.1);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
            osc.start(now);
            osc.stop(now + 0.11);
          } else if (type === 'sim') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
          }
        } catch (e) { /* Ignore audio block if restricted */ }
      }
    };

    const ConfettiFX = (() => {
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let rafId = null;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function burst(count = 36) {
        const colors = ['#10b981', '#3b82f6', '#6366f1', '#f59e0b', '#ec4899'];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: canvas.width * 0.5 + (Math.random() - 0.5) * 140,
            y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 11,
            vy: -Math.random() * 10 - 3,
            size: Math.random() * 7 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 12,
            life: 1
          });
        }
        if (!rafId) loop();
      }

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.rot += p.vRot;
          p.life -= 0.018;

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        });
        particles = particles.filter(p => p.life > 0);
        if (particles.length > 0) {
          rafId = requestAnimationFrame(loop);
        } else {
          rafId = null;
        }
      }

      return { burst };
    })();

              return `
                <button type="button"
                  class="tile-btn type-${tClass} ${visited ? 'visited' : ''} ${selected ? 'selected' : ''}"
                  data-item-id="${item.id}">
                  <span class="tile-status">${visited ? '✅' : '👆'}</span>
                  ${SVG_ART[item.id]}
                  <span>${item.name}</span>
                </button>
              `;
            }).join('')}
          </div>
          <div class="info-panel ${typeClass ? 'type-' + typeClass : ''}">
            ${selectedItem ? `
              <div class="info-panel-visual">${SVG_ART[selectedItem.id]}</div>
              <div class="info-panel-content">
                <div class="info-panel-header">
                  <span class="category-chip chip-${typeClass}">${selectedItem.category}</span>
                  <span>${selectedItem.name}</span>
                </div>
                <div class="info-panel-body">${selectedItem.detail}</div>
                <div class="info-panel-note">📌 ${selectedItem.note}</div>
              </div>
            ` : `
              <div class="info-panel-body" style="width:100%; text-align:center; color:var(--text-muted);">
                👆 Tap any component tile above to reveal how it works on CyberPi.
              </div>
            `}
          </div>
        `;
      } else {
        interactiveHTML = `
          <div class="sim-wrapper">
            <div class="cyberpi-board">
              <div class="board-brand-bar">
                <span>CYBERPI STUDIO</span>
                <span style="color:#10b981;">● ONLINE</span>
              </div>
              <div class="led-strip" id="sim-leds">
                <div class="led-bulb"></div>
                <div class="led-bulb"></div>
                <div class="led-bulb"></div>
                <div class="led-bulb"></div>
                <div class="led-bulb"></div>
              </div>
              <div class="cyberpi-screen" id="sim-screen">
                <div class="screen-emoji" id="sim-screen-emoji">😴</div>
                <div class="screen-text" id="sim-screen-text">Waiting for Button A...</div>
                <div class="wave-bars">
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                  <span class="wave-bar"></span>
                </div>
              </div>
              <div class="sim-controls-row">
                <button type="button" class="joystick-mock" id="sim-joystick" title="Tap Joystick Up"><div class="joystick-stick"></div></button>
                <button type="button" class="btn-a-sim" id="sim-btn-a">HOLD A</button>
                <div class="btn-b-mock" title="Button B">B</div>
              </div>
            </div>

            <div class="sim-right-panel">
              <div>
                <div style="font-size:0.8rem; font-weight:800; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;">Live Signal Flow</div>
                <div class="ipo-live-indicators">
                  <div class="live-pill" id="ind-input">🟢 INPUT<br><span style="font-weight:500;" id="ind-input-sub">Released</span></div>
                  <div class="live-pill" id="ind-process">🧠 PROCESS<br><span style="font-weight:500;" id="ind-process-sub">Checking...</span></div>
                  <div class="live-pill" id="ind-output">🔵 OUTPUT<br><span style="font-weight:500;" id="ind-output-sub">LEDs Off</span></div>
                </div>
              </div>

              <div>
                <div style="font-size:0.8rem; font-weight:800; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;">Live CyberPi Code</div>
                <div class="code-box">
                  <div class="code-line" id="code-1">forever:</div>
                  <div class="code-line" id="code-2">&nbsp;&nbsp;if button_a.is_pressed():</div>
                  <div class="code-line" id="code-3">&nbsp;&nbsp;&nbsp;&nbsp;leds.on("blue") &amp; screen("HI!")</div>
                  <div class="code-line" id="code-4">&nbsp;&nbsp;else:</div>
                  <div class="code-line" id="code-5">&nbsp;&nbsp;&nbsp;&nbsp;leds.off() &amp; screen("Waiting...")</div>
                </div>
              </div>

              <div class="sim-hint" id="sim-status-hint">
                ${isStepComplete ? '✅ Great job! You tested the Input → Process → Output loop.' : '👇 Press and hold the green Button A (or tap the Joystick) to unlock Next.'}
              </div>
            </div>
          </div>
        `;
      }

      rootEl.innerHTML = `
        <section class="card-surface">
          <div class="step-meta">
            <span class="step-counter">STEP ${step.stepNum} OF 5</span>
            <span class="explore-badge ${isStepComplete ? 'complete' : ''}">
              ${isStepComplete ? `✅ Explored ${exploredCount}/${requiredCount}` : `Explore ${exploredCount}/${requiredCount}`}
            </span>
          </div>

          <div class="hero-banner-card">
            <div class="step-hero-text">
              <h1>${step.title}</h1>
              <p class="step-intro">${step.intro}</p>
            </div>
            <div class="step-hero-art">${SVG_ART['hero-board']}</div>
          </div>

          ${interactiveHTML}

          <div class="takeaway-banner">
            <span style="font-size:1.25rem;">⭐</span>
            <span>${step.takeaway}</span>
          </div>

          <div class="nav-footer">
            <button type="button" class="btn btn-secondary" id="btn-prev" ${stepIdx === 0 ? 'disabled' : ''}>
              ← Back
            </button>
            <button type="button" class="btn btn-primary" id="btn-next" ${!isStepComplete ? 'disabled' : ''}>
              ${stepIdx === 4 ? 'Start Swipe & Sort →' : 'Next →'}
            </button>
          </div>
        </section>
      `;

      if (stepIdx === 0) {
        rootEl.querySelectorAll('[data-node-id]').forEach(btn => {
          btn.addEventListener('click', () => {
            SoundFX.play('tap');
            const id = btn.getAttribute('data-node-id');
            state.exploredByStep[0].add(id);
            state.selectedItemByStep[0] = id;
            renderLearnPhase();
          });
        });
      } else if (stepIdx >= 1 && stepIdx <= 3) {
        rootEl.querySelectorAll('[data-item-id]').forEach(btn => {
          btn.addEventListener('click', () => {
            SoundFX.play('tap');
            const id = btn.getAttribute('data-item-id');
            state.exploredByStep[stepIdx].add(id);
            state.selectedItemByStep[stepIdx] = id;
            renderLearnPhase();
          });
        });
      } else {
        bindSimulatorEvents();
      }

      const prevBtn = document.getElementById('btn-prev');
      const nextBtn = document.getElementById('btn-next');

      if (prevBtn) {
        prevBtn.addEventListener('click', () => {
          if (state.learnStepIndex > 0) {
            SoundFX.play('tap');
            state.learnStepIndex--;
            updateHeaderProgress();
            renderLearnPhase();
          }
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          SoundFX.play('tap');
          if (state.learnStepIndex < 4) {
            state.learnStepIndex++;
            updateHeaderProgress();
            renderLearnPhase();
          } else {
            startSortPhase();
          }
        });
      }
    }

    /* ========================================================================
       STEP 5 SIMULATOR LOGIC (Mouse + Touch Hold + Bonus Joystick Pulse)
       ======================================================================== */
    function bindSimulatorEvents() {
      const btnA = document.getElementById('sim-btn-a');
      const joyBtn = document.getElementById('sim-joystick');
      if (!btnA) return;

      const unlockStep5 = () => {
        if (!state.exploredByStep[4].has('tested')) {
          state.exploredByStep[4].add('tested');
          const nextBtn = document.getElementById('btn-next');
          const badge = document.querySelector('.explore-badge');
          const hint = document.getElementById('sim-status-hint');
          if (nextBtn) nextBtn.disabled = false;
          if (badge) {
            badge.classList.add('complete');
            badge.textContent = '✅ Explored 1/1';
          }
          if (hint) {
            hint.textContent = '✅ Great job! You tested the Input → Process → Output loop.';
          }
        }
      };

      const setSimActive = (isPressed) => {
        state.simPressed = isPressed;
        const leds = document.querySelectorAll('#sim-leds .led-bulb');
        const screen = document.getElementById('sim-screen');
        const screenEmoji = document.getElementById('sim-screen-emoji');
        const screenText = document.getElementById('sim-screen-text');

        const indInput = document.getElementById('ind-input');
        const indInputSub = document.getElementById('ind-input-sub');
        const indProcess = document.getElementById('ind-process');
        const indProcessSub = document.getElementById('ind-process-sub');
        const indOutput = document.getElementById('ind-output');
        const indOutputSub = document.getElementById('ind-output-sub');

        const c2 = document.getElementById('code-2');
        const c3 = document.getElementById('code-3');
        const c4 = document.getElementById('code-4');
        const c5 = document.getElementById('code-5');

        if (isPressed) {
          SoundFX.play('sim');
          btnA.classList.add('pressed');
          leds.forEach(b => {
            b.classList.remove('joy-on');
            b.classList.add('on');
          });
          screen.classList.remove('joy-screen');
          screen.classList.add('active-screen');
          screenEmoji.textContent = '🚀';
          screenText.textContent = 'HI! Button A Active';

          indInput.className = 'live-pill lit-input';
          indInputSub.textContent = 'Pressed (1)';
          indProcess.className = 'live-pill lit-process';
          indProcessSub.textContent = 'If = True';
          indOutput.className = 'live-pill lit-output';
          indOutputSub.textContent = 'LEDs + Screen';

          c2.className = 'code-line hl-input';
          c3.className = 'code-line hl-output';
          c4.className = 'code-line';
          c5.className = 'code-line';

          unlockStep5();
        } else {
          btnA.classList.remove('pressed');
          leds.forEach(b => b.classList.remove('on', 'joy-on'));
          screen.classList.remove('active-screen', 'joy-screen');
          screenEmoji.textContent = '😴';
          screenText.textContent = 'Waiting for Button A...';

          indInput.className = 'live-pill';
          indInputSub.textContent = 'Released (0)';
          indProcess.className = 'live-pill lit-process';
          indProcessSub.textContent = 'Else Branch';
          indOutput.className = 'live-pill';
          indOutputSub.textContent = 'LEDs Off';

          c2.className = 'code-line';
          c3.className = 'code-line';
          c4.className = 'code-line hl-process';
          c5.className = 'code-line hl-output';
        }
      };

      setSimActive(false);

      btnA.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        btnA.setPointerCapture(e.pointerId);
        setSimActive(true);
      });

      const releaseHandler = () => setSimActive(false);
      btnA.addEventListener('pointerup', releaseHandler);
      btnA.addEventListener('pointercancel', releaseHandler);

      if (joyBtn) {
        joyBtn.addEventListener('click', () => {
          SoundFX.play('sim');
          joyBtn.classList.add('tilted');
          const leds = document.querySelectorAll('#sim-leds .led-bulb');
          const screen = document.getElementById('sim-screen');
          const screenEmoji = document.getElementById('sim-screen-emoji');
          const screenText = document.getElementById('sim-screen-text');
          const indInput = document.getElementById('ind-input');
          const indInputSub = document.getElementById('ind-input-sub');
          const indOutput = document.getElementById('ind-output');
          const indOutputSub = document.getElementById('ind-output-sub');

          leds.forEach(b => b.classList.add('joy-on'));
          screen.classList.add('joy-screen');
          screenEmoji.textContent = '🕹️';
          screenText.textContent = 'Joystick: UP!';
          indInput.className = 'live-pill lit-input';
          indInputSub.textContent = 'Joy UP (1)';
          indOutput.className = 'live-pill lit-output';
          indOutputSub.textContent = 'Green LEDs';
          unlockStep5();

          setTimeout(() => {
            joyBtn.classList.remove('tilted');
            if (!state.simPressed) setSimActive(false);
          }, 950);
        });
      }
    }

    /* ========================================================================
       PHASE 2: SWIPE & SORT GAME
       ======================================================================== */
    function startSortPhase() {
      state.phase = 'sort';
      state.sortDeck = shuffleArray(LESSON_ITEMS);
      state.sortIndex = 0;
      state.sortScore = 0;
      state.sortMissed = [];
      state.sortLocked = false;
      updateHeaderProgress();
      renderSortPhase();
    }

    function renderSortPhase() {
      const currentItem = state.sortDeck[state.sortIndex];
      const hasNextCard = state.sortIndex + 1 < state.sortDeck.length;

      rootEl.innerHTML = `
        <section class="card-surface">
          <div class="swipe-header-stats">
            <span>Card ${state.sortIndex + 1} of ${state.sortDeck.length}</span>
            <span>Score: ${state.sortScore}</span>
          </div>

          <div class="swipe-legend">
            <span class="legend-left">⬅️ Swipe Left: OUTPUT</span>
            <span class="legend-right">Swipe Right: INPUT ➡️</span>
          </div>

          <div class="swipe-stage" id="swipe-stage">
            ${hasNextCard ? '<div class="swipe-card-backdrop"></div>' : ''}
            <div class="swipe-card" id="swipe-card">
              <span class="swipe-stamp stamp-output" id="stamp-output">OUTPUT</span>
              <span class="swipe-stamp stamp-input" id="stamp-input">INPUT</span>
              <div class="swipe-visual-box">${SVG_ART[currentItem.id]}</div>
              <div class="swipe-title">${currentItem.name}</div>
              <div class="swipe-clue">${currentItem.clue}</div>
            </div>
          </div>

          <div class="feedback-toast" id="sort-feedback">
            Drag the card or tap a button below to sort it!
          </div>

          <div class="swipe-buttons">
            <button type="button" class="btn-sort-output" id="btn-choose-output">⬅️ OUTPUT</button>
            <button type="button" class="btn-sort-input" id="btn-choose-input">INPUT ➡️</button>
          </div>
        </section>
      `;

      const card = document.getElementById('swipe-card');
      const stampInput = document.getElementById('stamp-input');
      const stampOutput = document.getElementById('stamp-output');
      const btnOut = document.getElementById('btn-choose-output');
      const btnIn = document.getElementById('btn-choose-input');

      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      const handleChoice = (chosenCategory) => {
        if (state.sortLocked) return;
        state.sortLocked = true;
        btnOut.disabled = true;
        btnIn.disabled = true;

        const isCorrect = chosenCategory === currentItem.category;
        const feedbackEl = document.getElementById('sort-feedback');

        const flyX = chosenCategory === 'INPUT' ? 340 : -340;
        card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
        card.style.transform = `translateX(${flyX}px) rotate(${chosenCategory === 'INPUT' ? 16 : -16}deg)`;
        card.style.opacity = '0';

        if (isCorrect) {
          SoundFX.play('correct');
          ConfettiFX.burst(24);
          state.sortScore++;
          feedbackEl.className = 'feedback-toast correct';
          feedbackEl.textContent = `✅ Spot on! ${currentItem.name} is an ${currentItem.category}.`;
        } else {
          SoundFX.play('wrong');
          state.sortMissed.push(currentItem);
          feedbackEl.className = 'feedback-toast wrong';
          const reason = currentItem.category === 'INPUT'
            ? 'It sends information INTO CyberPi.'
            : 'It sends a result OUT from CyberPi.';
          feedbackEl.textContent = `❌ Actually, ${currentItem.name} is an ${currentItem.category}. ${reason}`;
        }

        const delay = isCorrect ? 1050 : 2300;
        setTimeout(() => {
          state.sortIndex++;
          state.sortLocked = false;
          if (state.sortIndex < state.sortDeck.length) {
            updateHeaderProgress();
            renderSortPhase();
          } else {
            startFlashPhase();
          }
        }, delay);
      };

      card.addEventListener('pointerdown', (e) => {
        if (state.sortLocked) return;
        isDragging = true;
        startX = e.clientX;
        card.classList.add('dragging');
        card.setPointerCapture(e.pointerId);
      });

      card.addEventListener('pointermove', (e) => {
        if (!isDragging || state.sortLocked) return;
        currentX = e.clientX - startX;
        const rotate = currentX * 0.06;
        card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;

        if (currentX > 25) {
          card.classList.add('tint-input');
          card.classList.remove('tint-output');
          stampInput.style.opacity = Math.min(1, currentX / 90);
          stampOutput.style.opacity = 0;
        } else if (currentX < -25) {
          card.classList.add('tint-output');
          card.classList.remove('tint-input');
          stampOutput.style.opacity = Math.min(1, Math.abs(currentX) / 90);
          stampInput.style.opacity = 0;
        } else {
          card.classList.remove('tint-input', 'tint-output');
          stampInput.style.opacity = 0;
          stampOutput.style.opacity = 0;
        }
      });

      const endDrag = () => {
        if (!isDragging) return;
        isDragging = false;
        card.classList.remove('dragging');

        if (currentX > 85) {
          handleChoice('INPUT');
        } else if (currentX < -85) {
          handleChoice('OUTPUT');
        } else {
          card.style.transform = '';
          card.classList.remove('tint-input', 'tint-output');
          stampInput.style.opacity = 0;
          stampOutput.style.opacity = 0;
        }
        currentX = 0;
      };

      card.addEventListener('pointerup', endDrag);
      card.addEventListener('pointercancel', endDrag);

      btnOut.addEventListener('click', () => handleChoice('OUTPUT'));
      btnIn.addEventListener('click', () => handleChoice('INPUT'));
    }

    /* ========================================================================
       PHASE 3: 3D FLASHCARDS
       ======================================================================== */
    function startFlashPhase() {
      state.phase = 'flash';
      state.flashDeck = shuffleArray(LESSON_ITEMS);
      state.flashFlipped = false;
      state.flashAgainCount = 0;
      updateHeaderProgress();
      renderFlashPhase();
    }

    function renderFlashPhase() {
      if (state.flashDeck.length === 0) {
        renderSummaryScreen();
        return;
      }

      const card = state.flashDeck[0];
      const typeClass = card.category.toLowerCase();

      rootEl.innerHTML = `
        <section class="card-surface">
          <div class="swipe-header-stats">
            <span>Flashcard Review</span>
            <span>Cards Remaining: ${state.flashDeck.length}</span>
          </div>

          <div class="flashcard-scene" id="flash-scene">
            <div class="flashcard-inner ${state.flashFlipped ? 'is-flipped' : ''}" id="flash-inner">
              <!-- Front -->
              <div class="flashcard-face flashcard-front">
                <span class="tap-hint">What am I? (Tap card to flip)</span>
                <p style="font-size:1.12rem; font-weight:700; line-height:1.45;">
                  “${card.clue}”
                </p>
              </div>
              <!-- Back -->
              <div class="flashcard-face flashcard-back type-${typeClass}">
                <span class="category-chip chip-${typeClass}" style="margin-bottom:12px;">${card.category}</span>
                <div class="swipe-visual-box" style="margin-bottom:10px;">${SVG_ART[card.id]}</div>
                <div style="font-size:1.35rem; font-weight:800;">${card.name}</div>
              </div>
            </div>
          </div>

          <div class="flashcard-actions">
            <button type="button" class="btn btn-secondary" id="btn-flash-again">
              🔄 Again
            </button>
            <button type="button" class="btn btn-primary" id="btn-flash-gotit">
              ✅ Got it
            </button>
          </div>
        </section>
      `;

      const scene = document.getElementById('flash-scene');
      const inner = document.getElementById('flash-inner');

      scene.addEventListener('click', () => {
        SoundFX.play('flip');
        state.flashFlipped = !state.flashFlipped;
        inner.classList.toggle('is-flipped', state.flashFlipped);
      });

      document.getElementById('btn-flash-again').addEventListener('click', () => {
        SoundFX.play('tap');
        const missedCard = state.flashDeck.shift();
        state.flashDeck.push(missedCard);
        state.flashAgainCount++;
        state.flashFlipped = false;
        updateHeaderProgress();
        renderFlashPhase();
      });

      document.getElementById('btn-flash-gotit').addEventListener('click', () => {
        SoundFX.play('correct');
        state.flashDeck.shift();
        state.flashFlipped = false;
        updateHeaderProgress();
        renderFlashPhase();
      });
    }

    /* ========================================================================
       FINAL SCREEN
       ======================================================================== */
    function renderSummaryScreen() {
      state.phase = 'summary';
      updateHeaderProgress();
      SoundFX.play('correct');
      ConfettiFX.burst(60);

      const missedHTML = state.sortMissed.length === 0
        ? `<p style="color:var(--color-input-text); font-weight:800;">🌟 Zero missed cards in Swipe &amp; Sort! Perfect score!</p>`
        : `
          <div class="missed-pills">
            ${state.sortMissed.map(item => `
              <span class="missed-pill" style="
                background: var(--color-${item.category.toLowerCase()}-bg);
                color: var(--color-${item.category.toLowerCase()}-text);
                border: 1px solid var(--color-${item.category.toLowerCase()}-border);
              ">
                ${item.emoji} ${item.name} (${item.category})
              </span>
            `).join('')}
          </div>
        `;

      rootEl.innerHTML = `
        <section class="card-surface">
          <div class="hero-banner-card">
            <div class="step-hero-text">
              <h1>🎉 Lesson Complete!</h1>
              <p class="step-intro">You explored CyberPi’s inputs, outputs, and live microcontroller loop.</p>
            </div>
            <div class="step-hero-art">${SVG_ART['hero-board']}</div>
          </div>

          <div class="score-grid">
            <div class="score-box">
              <div class="score-number">${state.sortScore} / ${LESSON_ITEMS.length}</div>
              <div class="score-label">Swipe &amp; Sort Score</div>
            </div>
            <div class="score-box">
              <div class="score-number">${state.flashAgainCount}</div>
              <div class="score-label">Flashcards Retried</div>
            </div>
          </div>

          <h3 style="font-size:1rem; margin-bottom:6px;">Items to Review from Swipe &amp; Sort:</h3>
          ${missedHTML}

          <h3 style="font-size:1rem; margin-top:14px;">Main Lesson Takeaways:</h3>
          <ul class="summary-list">
            ${PHASE1_STEPS.map(s => `<li>⭐ ${s.takeaway.replace('Key Takeaway: ', '')}</li>`).join('')}
          </ul>

          <button type="button" class="btn btn-primary" style="width:100%;" id="btn-restart">
            🔁 Start Again
          </button>
        </section>
      `;

      document.getElementById('btn-restart').addEventListener('click', () => {
        state.phase = 'learn';
        state.learnStepIndex = 0;
        state.exploredByStep = { 0: new Set(), 1: new Set(), 2: new Set(), 3: new Set(), 4: new Set() };
        state.selectedItemByStep = { 0: null, 1: null, 2: null, 3: null };
        state.sortDeck = [];
        state.sortIndex = 0;
        state.sortScore = 0;
        state.sortMissed = [];
        state.flashDeck = [];
        state.flashFlipped = false;
        state.flashAgainCount = 0;
        updateHeaderProgress();
        renderLearnPhase();
      });
    }

    /* ========================================================================
       BOOT LESSON
       ======================================================================== */
    applyTheme(state.theme);
    updateHeaderProgress();
    renderLearnPhase();
  </script>
</body>
</html>
